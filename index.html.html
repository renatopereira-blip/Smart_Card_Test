   <script type="module">
      import { Home } from './ui/home.js';
      import { Help } from './ui/help.js';
      import { Overview } from './ui/overview.js';
      // import { Ping } from './ui/ping.js';
      import { PEM } from './ui/pem.js';
      import { Sign } from './ui/sign.js';
      import { SignPDF } from './ui/sign-pdf.js';
      import { Read } from './ui/read.js';
      import { InsecureRead } from './ui/insecure-read.js';
      import { CardStatus } from './ui/components/card-status.js';
      import { Results } from './ui/components/results.js';

      // CUF Smartcard client API
      // import { CUFSmartCardClient } from "/cuf-smartcard-client-api/mod.js";
      // const SCClient = new CUFSmartCardClient();
      // SCClient.initialize();
      // Initialize slaApp
      slaApp.init('CUFSmartcardTest','pt', 5);

      const { createApp } = Vue

      const routes = [
         { path: '/', component: Home },
         { path: '/help', component: Help },
         { path: '/overview', component: Overview },
         // { path: '/ping', component: Ping },
         { path: '/pem', component: PEM },
         //{ path: '/sign', component: Sign },
         { path: '/signpdf', component: SignPDF },
         //{ path: '/read', component: Read },
         //{ path: '/insecureread', component: InsecureRead },
      ]

      const router = VueRouter.createRouter({
         history: VueRouter.createWebHashHistory(),
         routes,
      })

      export const app = createApp({
         emits: ['statusChanged'],
         data() {
            return {
               currentTab: 'dashboard',
               currentNavBar: "Home",
               currentEntity: "dashboard",
               isBurgerActive: false,
               isActiveSidebar: true,
               projectName: 'CUF Smartcard Test',
               projectDescription: 'Test CUF Smartcard Client API, and simulate a Client Applications'
            }
         },
         methods: {
            onSCAPINotification(name, oldValue, newValue) {
               //console.log("SCCClient notification,", name);
               //console.table(newValue);
               switch (name) {
                  case "statusChanged":
                     console.log("Emit statusChanged...");
                     this.$emit("statusChanged", newValue);
                     break;
                  default: break;
               }
            },
         },
         mounted() {
            //console.log("MOUNTED onSCAPINotification main app:", typeof this.onSCAPINotification);
            SCClient.subscribe(this.onSCAPINotification);
         }
      })

      app.config.globalProperties.$filters = {
         ISODate(value) {
            return (new Date(Date.parse(value))).toISOString()
         }
      }

      app.config.globalProperties.SCClient = SCClient;
      app.config.globalProperties.slaApp = slaApp;

      // Global Components
      app.component('CardStatus', CardStatus);
      app.component('Results', Results);

      app.use(router);

      app.mount('#app');

   </script>
